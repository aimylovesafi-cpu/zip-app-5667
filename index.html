<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIxScanner v3 FIXED</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#080a12;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{max-width:900px;width:100%;padding:18px 22px;display:flex;justify-content:space-between;border-bottom:1px solid #1e2235;font-weight:800}
.wrap{max-width:900px;width:100%;padding:20px;display:grid;gap:18px}
.card{background:#11131f;border:1px solid #1e2235;border-radius:20px;padding:18px}
#view{position:relative;aspect-ratio:4/3;background:#05070d;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #1e2235}
#video{width:100%;height:100%;object-fit:cover;display:none}
.btn{padding:14px 18px;border-radius:12px;border:1px solid #1e2235;font-weight:800;cursor:pointer;text-align:center}
.primary{background:#ffffff;color:#000000;width:100%}
.dark{background:#171a2b;color:#ffffff;width:100%}
.status{margin-top:12px;padding:12px;border-radius:12px;background:#0a0c16;border:1px solid #1e2235;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#94a3b8}
.ok{border-color:rgba(16,185,129,0.4)!important;background:#052e16!important;color:#6ee7b7!important}
.bad{border-color:rgba(239,68,68,0.4)!important;background:#1a0a0a!important;color:#fca5a5!important}
#preview{width:100%;display:none;margin-top:12px;border-radius:12px;border:1px solid #1e2235}
#out{width:100%;margin-top:10px;background:#05070d;border:1px solid #1e2235;color:#cbd5e1;border-radius:12px;padding:12px;min-height:130px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="top"><b>AIxScanner FIXED</b><span style="font-size:10px;opacity:.5">AIxFACTORY</span></div>
<div class="wrap">
<div class="card">
<div id="view"><video id="video" autoplay playsinline muted></video><canvas id="canvasLive"></canvas><div id="place" style="font-size:40px">👁️</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
<button id="startBtn" class="btn primary">START CAMERA</button>
<button id="snapBtn" class="btn dark" disabled>SCAN FRAME</button>
</div>
<button id="galBtn" class="btn dark" style="margin-top:10px;border-style:dashed;background:transparent;border-color:#3b82f6;color:#3b82f6">LOAD FROM GALLERY / FILES</button>
<img id="preview">
<div id="status" class="status">READY AIxScanner v3 - Universal decoder. Use ORIGINAL PNG.</div>
<textarea id="out" readonly placeholder="Decoded payload..."></textarea>
</div>
</div>
<canvas id="work" style="display:none"></canvas>
<script>
const video=document.getElementById('video'), canvasLive=document.getElementById('canvasLive'), ctxLive=canvasLive.getContext('2d',{willReadFrequently:true}), work=document.getElementById('work'), wCtx=work.getContext('2d',{willReadFrequently:true});
const startBtn=document.getElementById('startBtn'), snapBtn=document.getElementById('snapBtn'), galBtn=document.getElementById('galBtn'), statusEl=document.getElementById('status'), outEl=document.getElementById('out'), preview=document.getElementById('preview'), place=document.getElementById('place');
const input=document.createElement('input'); input.type='file'; input.accept='image/png,image/*';
function binToText16(bin){let t='';for(let i=0;i<bin.length-32;i+=16){const c=bin.substr(i,16);if(c.length<16)break;const code=parseInt(c,2);if(isNaN(code))break;t+=String.fromCharCode(code);if(bin.substr(i+16,32)==='1'.repeat(32))break;}return t;}
function binToText8(bin){let t='';for(let i=0;i<bin.length-64;i+=8){const c=bin.substr(i,8);if(c.length<8)break;const code=parseInt(c,2);if(code===0)break;if(isNaN(code))break;t+=String.fromCharCode(code);if(bin.substr(i+8,32)==='1'.repeat(32))break;}return t;}
function isValid(s){if(!s||s.length<2||s.length>5000)return false;let ok=0;for(let ch of s){const c=ch.charCodeAt(0);if((c>=32&&c<=126)||c>=1536||c===10||c===13)ok++;}return ok/s.length>0.65;}
function tryDecode(data,mode){
  let bin=''; if(mode==='r'){for(let i=0;i<data.data.length;i+=4) bin+=(data.data[i]&1);} if(mode==='g'){for(let i=0;i<data.data.length;i+=4) bin+=(data.data[i+1]&1);} if(mode==='b'){for(let i=0;i<data.data.length;i+=4) bin+=(data.data[i+2]&1);} if(mode==='rgb'){for(let i=0;i<data.data.length;i+=4){bin+=(data.data[i]&1);bin+=(data.data[i+1]&1);bin+=(data.data[i+2]&1);}}
  return [{text:binToText16(bin),bin,mode:mode+'-16'},{text:binToText8(bin),bin,mode:mode+'-8'}];
}
function analyzeFull(imgData){
  const modes=['r','g','b','rgb']; let best=null;
  for(let m of modes){let rs=tryDecode(imgData,m); for(let r of rs){if(isValid(r.text)){if(!best||r.text.length>best.text.length) best=r;}}}
  if(best) return best; let fb=tryDecode(imgData,'r')[0]; return {text:'',bin:fb.bin,mode:'none'};
}
function render(res,w,h){
  let ones=0; for(let i=0;i<res.bin.length;i++) if(res.bin[i]=='1') ones++; let ratio=ones/res.bin.length;
  if(res.text && isValid(res.text)){statusEl.className='status ok'; statusEl.textContent=`DECODED! Mode:${res.mode} | ${w}x${h} | ratio ${ratio.toFixed(4)}`; outEl.value=res.text;}
  else {statusEl.className='status bad'; statusEl.textContent=`No payload. Ratio ${ratio.toFixed(4)} - Use ORIGINAL PNG.`; outEl.value='';}
}
startBtn.onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=s;video.style.display='block';place.style.display='none';startBtn.disabled=true;snapBtn.disabled=false;}catch(e){statusEl.textContent='Camera error: '+e.message;}};
snapBtn.onclick=()=>{canvasLive.width=video.videoWidth; canvasLive.height=video.videoHeight; ctxLive.drawImage(video,0,0,canvasLive.width,canvasLive.height); work.width=canvasLive.width; work.height=canvasLive.height; const d=ctxLive.getImageData(0,0,canvasLive.width,canvasLive.height); const res=analyzeFull(d); render(res,work.width,work.height);};
galBtn.onclick=()=>input.click();
input.onchange=e=>{const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=ev=>{const img=new Image(); img.onload=()=>{preview.src=ev.target.result; preview.style.display='block'; work.width=img.naturalWidth; work.height=img.naturalHeight; wCtx.drawImage(img,0,0); const d=wCtx.getImageData(0,0,work.width,work.height); const res=analyzeFull(d); render(res,work.width,work.height);}; img.src=ev.target.result;}; fr.readAsDataURL(f);};
</script>
</body>
</html>
